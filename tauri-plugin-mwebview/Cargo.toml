[package]
name = "tauri-plugin-mwebview"
version = "0.1.0"
authors = [ "You" ]
description = "A Tauri plugin for mobile WebView support (Android/iOS)"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mwebview"

[dependencies]
tauri = { version = "2.10.3" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
