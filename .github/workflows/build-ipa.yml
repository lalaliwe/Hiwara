name: Build Sideloadable iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Sideloadable iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode.app" | sort -V | tail -n 1)
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Initialize Tauri iOS Project
        run: |
          CI=true npx tauri ios init

      - name: Patch Xcode Project for Unsigned Sideloading
        run: |
          # Switch signing style from Automatic to Manual and disable signing requirements
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' {} +
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' '/buildSettings = {/a\
          				CODE_SIGNING_ALLOWED = NO;\
          				CODE_SIGNING_REQUIRED = NO;\
          				CODE_SIGN_IDENTITY = "";\
          				CODE_SIGN_STYLE = Manual;\
          ' {} +
          echo "Patched project.pbxproj for manual unsigned build."

      - name: Build Web Assets
        run: npm run build

      - name: Build iOS App with Tauri CLI
        run: |
          CI=true npx tauri ios build --target aarch64 --verbose -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa File
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v "DerivedData" | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find compiled .app bundle"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -9 Hiwara.ipa Payload
          cd ..
          echo "IPA successfully packaged at build/Hiwara.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiwara-iOS-Sideloadable
          path: build/Hiwara.ipa
          retention-days: 14
